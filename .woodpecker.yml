when:
  - event: [push, pull_request, tag]

steps:
  - name: frontend
    image: node:22-bookworm
    commands:
      - corepack enable
      - corepack prepare pnpm@10 --activate
      - pnpm install --frozen-lockfile
      - pnpm exec tsc --noEmit
      - pnpm build

  - name: rust-linux
    image: rust:1-bookworm
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev pkg-config
      - cargo check --manifest-path src-tauri/Cargo.toml

  # Windows compile check on the Linux runner (non-blocking; native Windows/macOS
  # builds run in the GitHub Actions mirror).
  - name: rust-windows-crosscheck
    image: rust:1-bookworm
    failure: ignore
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends mingw-w64
      - rustup target add x86_64-pc-windows-gnu
      - cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-gnu
